version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR per week for routine bumps; security updates still open on their own.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Pinned in the pnpm catalog on purpose; bump deliberately.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: vite
      # @types/node follows the Node 24 runtime contract
      # (scripts/node-runtime-contract.test.mjs); bump it together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # plugin-react 6 requires Vite 8; it waits for a deliberate Vite 8 upgrade.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
