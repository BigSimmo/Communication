name: Code Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  review:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Version comes from packageManager in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate agent instructions and packaged resources (offline)
        run: pnpm run agent-rules:check

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm -r --if-present run test

      - name: Build production app
        run: pnpm --filter @workspace/tc-reference build

      - name: Run Automated Code Reviewer
        env:
          CODE_REVIEW_SKIP_CHECKS: "1"
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm run code-review --base "$REVIEW_BASE" --head "$REVIEW_HEAD"
