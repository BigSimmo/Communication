<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TC Reference Tool</title>
    <meta name="description" content="A mobile-first reference library of 31 communication techniques — phrase banks, decision trees, scenarios and daily practice drills. No account required." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1724" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta property="og:title" content="TC Reference Tool" />
    <meta property="og:description" content="A mobile-first reference library of 31 communication techniques — phrase banks, decision trees, scenarios and daily practice drills." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TC Reference Tool" />
    <meta name="twitter:description" content="A mobile-first reference library of 31 communication techniques — phrase banks, decision trees, scenarios and daily practice drills." />
    <meta name="twitter:image" content="/opengraph.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tc_theme');
          var theme = (stored === 'light' || stored === 'dark')
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
